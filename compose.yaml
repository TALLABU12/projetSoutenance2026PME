services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pme
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pme-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pme"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: projet-soutenance2026pme:latest
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/pme
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_JWT_EXPIRATION: ${APP_JWT_EXPIRATION}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pme-postgres-data: